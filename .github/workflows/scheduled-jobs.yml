# Every 10 minutes: appointment reminders (~1 hour before), the retry of
# unanswered chats and keyword auto-replies to comments Meta didn't notify. Vercel Hobby crons only run once a day, so GitHub calls
# the protected routes instead. Needs the repository secret CRON_SECRET
# (same value as in Vercel).
name: Scheduled jobs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Only calls a few URLs: the job's GitHub token needs no access at all.
permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Read from the environment instead of being pasted into the commands,
      # so it never ends up in a rendered script or a debug trace.
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Appointment reminders
        run: curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://agente.funnelslabs.app/api/cron/appointment-reminders
      - name: Retry unanswered chats
        if: always()
        run: curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://agente.funnelslabs.app/api/cron/retry-replies
      - name: Comment auto-replies
        if: always()
        run: curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://agente.funnelslabs.app/api/cron/comment-replies
