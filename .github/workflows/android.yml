# Builds the Android app (a Trusted Web Activity that opens the platform full screen).
#  - Always: a test APK you can install on a phone (download it from the run's "Artifacts").
#  - Only when the signing key is saved as repository secrets: the signed bundle (.aab)
#    that is uploaded to Google Play. Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#    ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Google Play needs a bigger number on every upload.
      VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Test APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: funnels-labs-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Signed bundle for Google Play
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          gradle --no-daemon bundleRelease

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: funnels-labs-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
