# Weekly pull requests for security fixes and updates, grouped so they don't
# flood the repo. next / react / next-auth are pinned exactly in package.json,
# so their updates only ever arrive through these reviewed PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
